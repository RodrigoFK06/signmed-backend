name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # TensorFlow 2.19 no publica ruedas para 3.13+; fijar la version evita
          # que el job falle cuando el runner adopte una version mas nueva.
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        # requirements-dev.txt no arrastra TensorFlow ni MediaPipe (>1 GB): los
        # tests cubren la API y la logica de negocio, no la inferencia real.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Comprobar que los artefactos del modelo estan presentes
        # Sin esto, un artefacto ausente solo se detecta al desplegar.
        run: |
          test -f artifacts/lstm_holistic.h5
          test -f artifacts/label_encoder.pkl
          test -f artifacts/classes.json
          test -f artifacts/labels_catalog.json

      - name: Tests
        run: pytest -q --cov=app --cov-report=term-missing

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install ruff
      - run: ruff check app tests
